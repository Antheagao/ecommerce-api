spring.application.name=Ecommerce API
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecommerce}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# defer-datasource-initialization was only ever needed to run data.sql after
# Hibernate's ddl-auto=update created tables. data.sql never runs against
# Postgres (only embedded H2 in tests), and Postgres schema now comes from
# Flyway, so this is gone -- it also flips Flyway into "delayed" mode (runs
# after JPA, not before), which breaks ddl-auto=validate on a fresh DB.

# baseline-version=0 means Flyway still runs V1 against an already-populated
# compose volume (not just fresh DBs) -- V1 is written IF NOT EXISTS-safe to
# tolerate that. See db/migration/V1__baseline.sql for why.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT (no fallback - a publicly-known default would be a forgeable key in prod; set JWT_SECRET)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Stripe (test mode only). Empty defaults so the app boots with nothing set --
# payment endpoints 503 (PAYMENTS_UNAVAILABLE) until these are provided.
app.stripe.secret-key=${STRIPE_SECRET_KEY:}
app.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.stripe.success-url=${STRIPE_SUCCESS_URL:}
app.stripe.cancel-url=${STRIPE_CANCEL_URL:}
app.stripe.currency=usd

# Correlation pattern spliced into Boot's default console/file log patterns via
# LOG_CORRELATION_PATTERN -- surfaces orderNumber/stripeEventId MDC values (set on the payment
# path: StripeWebhookController, StripeCheckoutService, RefundService) on every log line without a
# custom logback-spring.xml. The trailing separator space is load-bearing (it keeps "]" off the
# log level) -- written as the unicode escape \u0020 so trim-trailing-whitespace editors
# can't silently delete it.
logging.pattern.correlation=[%X{orderNumber:-} %X{stripeEventId:-}]\u0020
