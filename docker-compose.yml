services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?copy .env.example to .env and set it}
      POSTGRES_USER: ${POSTGRES_USER:?copy .env.example to .env and set it}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set it}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?copy .env.example to .env and set it}
      DB_USERNAME: ${POSTGRES_USER:?copy .env.example to .env and set it}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env and set it}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env and set it}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      # Stripe is optional -- empty defaults (not :?) so compose still works
      # with no Stripe env at all; payment endpoints just 503 until set.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-}

volumes:
  pgdata:
